<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1b1510" />
<title>文言虚词 · 义项训练</title>
<style>
  :root{
    --bg:#14100c; --card:#211a14; --line:#3a2e24;
    --ink:#f0e6d8; --dim:#a09080; --warm:#d9a15b;
    --ok:#5f9a6a; --bad:#b4584a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Songti SC","STSong",'宋体',"Noto Serif SC",serif;
    min-height:100dvh;display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .app{width:100%;max-width:520px;padding:20px 18px 28px;display:flex;flex-direction:column;gap:14px}

  header{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  h1{font-size:20px;font-weight:600;letter-spacing:.06em}
  .sub{font-size:11px;color:var(--dim);letter-spacing:.14em}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:19px;color:var(--warm);font-weight:600}
  .stat span{font-size:10px;color:var(--dim)}

  .btn{
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:10px;padding:13px;font:inherit;font-size:15px;cursor:pointer;
    transition:background .2s,border-color .2s;
  }
  .btn:hover{border-color:var(--warm)}
  .btn.primary{background:var(--warm);color:#1a1208;border-color:var(--warm);font-weight:600}
  .btn.ghost{background:transparent;font-size:13px;color:var(--dim);padding:10px}
  .row{display:flex;gap:10px}
  .row .btn{flex:1}

  /* 答题卡 */
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  .qhead{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.1em;margin-bottom:12px}
  .char{font-size:44px;font-weight:600;line-height:1.1;color:#fff}
  .char small{font-size:14px;color:var(--dim);margin-left:8px;letter-spacing:.1em}
  .ex{font-size:19px;line-height:1.9;margin:12px 0 6px;letter-spacing:.04em}
  .ex em{color:#ffd9a8;font-style:normal;font-weight:700;background:rgba(217,161,91,.22);padding:0 .16em;border-radius:4px;box-shadow:0 0 0 1px rgba(217,161,91,.25)}
  .tr{margin-top:8px;font-size:13px;line-height:1.75;color:rgba(240,230,216,.62);letter-spacing:.02em}
  .tr b{color:rgba(240,230,216,.8);font-weight:400}
  .src{font-size:12px;color:var(--dim);letter-spacing:.06em}

  .opts{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .opt{
    text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;
    display:flex;gap:10px;align-items:baseline;transition:border-color .15s,background .15s;
  }
  .opt .k{color:var(--dim);font-size:12px;flex:0 0 18px}
  .opt:hover{border-color:var(--warm)}
  .opt.right{border-color:var(--ok);background:rgba(95,154,106,.12)}
  .opt.wrong{border-color:var(--bad);background:rgba(180,88,74,.12)}
  .opt:disabled{cursor:default}

  .fb{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(217,161,91,.08);border:1px solid rgba(217,161,91,.25);font-size:14px;line-height:1.8}
  .fb b{color:var(--warm)}
  .fb .sig{color:var(--dim);font-size:13px}

  .conf{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .conf h3{font-size:13px;color:var(--dim);font-weight:400;letter-spacing:.12em;margin-bottom:10px}
  .conf ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .conf li{font-size:13px;line-height:1.6;color:#ddd0c0}
  .conf li i{color:var(--bad);font-style:normal}

  footer{margin-top:auto;display:flex;gap:10px}
  footer .btn{flex:1;font-size:12px;padding:10px}
  #fillInput:focus{outline:none;border-color:var(--warm)!important;box-shadow:0 0 0 3px rgba(217,161,91,.12)}
  .hide{display:none!important}
  .tag{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--dim);margin-left:6px}
  .tag.warn{color:var(--bad);border-color:rgba(180,88,74,.4)}
  .tag.hs{color:#7fa86b;border-color:rgba(127,168,107,.45)}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;font-size:13px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--dim);cursor:pointer;font-family:inherit}
  .seg button.on{color:var(--warm);border-color:var(--warm);background:rgba(217,161,91,.1)}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>文言虚词 · 义项训练</h1>
    <span class="sub" id="todayLabel"></span>
  </header>

  <!-- 首页 -->
  <section id="home">
    <div class="stats">
      <div class="stat"><b id="sDue">0</b><span>待复习</span></div>
      <div class="stat"><b id="sNew">0</b><span id="sNewLabel">新义项</span></div>
      <div class="stat"><b id="sAcc">–</b><span>正确率</span></div>
      <div class="stat"><b id="sTotal">0</b><span>累计作答</span></div>
    </div>

    <div class="seg" style="margin-top:4px">
      <button id="mSense">义项训练</button>
      <button id="mPat">句式判断</button>
    </div>
    <div class="seg">
      <button id="fAll">全部（含初中补充）</button>
      <button id="fHs">只考高中篇目</button>
    </div>
    <div class="row">
      <button class="btn primary" id="startBtn">开始一组（20 张）</button>
    </div>

    <div class="conf" id="confBox">
      <h3>最常混淆的两张卡</h3>
      <ul id="confList"><li style="color:var(--dim)">还没有数据，先做一组</li></ul>
    </div>

    <div class="conf">
      <h3>说明</h3>
      <ul id="introList">
        <li>每张卡考一个<b>义项</b>，不是考一个字。同一个「之」，五个义项是五张卡。</li>
        <li>选项全部来自同一个字，模拟真实混淆。</li>
        <li>答错会把两张卡重新排进队列，明天先考。</li>
      </ul>
    </div>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="hide">
    <div class="q">
      <div class="qhead">
        <span id="qProgress">1 / 20</span>
        <span id="qChar"></span>
      </div>
      <div class="char" id="qCharBig">之<small id="qFunc"></small></div>
      <div class="ex" id="qEx"></div>
      <div class="src" id="qSrc"></div>

      <div class="opts" id="qOpts"></div>
      <div class="fb hide" id="qFb"></div>
    </div>

    <div class="row" style="margin-top:12px">
      <button class="btn ghost" id="quitBtn">结束本组</button>
      <button class="btn primary hide" id="nextBtn">下一题</button>
    </div>
  </section>

  <!-- 结算 -->
  <section id="done" class="hide">
    <div class="conf">
      <h3>本组完成</h3>
      <ul id="doneList"></ul>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="againBtn">再来一组</button>
      <button class="btn" id="backBtn">回首页</button>
    </div>
  </section>

  <footer>
    <button class="btn ghost" id="exportBtn">导出进度</button>
    <button class="btn ghost" id="importBtn">导入进度</button>
    <button class="btn ghost" id="resetBtn">清空</button>
  </footer>
</div>

<input type="file" id="fileInput" accept="application/json" class="hide" />

  if (!state.stat) state.stat = { sense: { a: 0, r: 0 }, pattern: { a: 0, r: 0 } };
  if (!state.stat.sense) state.stat.sense = { a: 0, r: 0 };
  if (!state.stat.pattern) state.stat.pattern = { a: 0, r: 0 };
  return state.stat[state.mode === "pattern" ? "pattern" : "sense"];
}
function bump(ok) { const b = statBucket(); b.a++; if (ok) b.r++; }

function cardState(id) { return state.cards[id] || { lv: 0, due: 0, seen: 0, wrong: 0 }; }

function allCards() {
  if (state.mode === "pattern") {
    return DATA2.map((x, i) => Object.assign({ id: "S" + i, idx: i, kind: "pat" }, x));
  }
  const out = [];
  for (const ch of Object.keys(DATA)) {
    DATA[ch].forEach((x, i) => out.push(Object.assign({ id: ch + "#" + i, ch, idx: i, kind: "sense" }, x)));
  }
  return state.filter === "高中" ? out.filter(c => c.st === "高中") : out;
}
function dueCards() {
  const now = Date.now();
  return allCards().filter(c => { const st = cardState(c.id); return st.seen > 0 && st.due <= now; });
}
function newCards() { return allCards().filter(c => cardState(c.id).seen === 0); }

function shuffle(a) { return a.slice().sort(() => Math.random() - 0.5); }

/* ============================================================
   出题
   ============================================================ */
function examplesOf(c) {
  const a = [{ e: c.e, src: c.src, tt: c.tt || "" }];
  if (c.e2) a.push({ e: c.e2, src: c.src2, tt: c.tt2 || "" });
  return a;
}
function pickExample(c) { const a = examplesOf(c); return a[Math.floor(Math.random() * a.length)]; }

/* tt 里〔〕标出目标词的译法：full 完整译文，mask 挖掉目标词 */
function splitT(tt) {
  const t = tt || "";
  return {
    full: t.replace(/〔(.*?)〕/g, "$1"),
    mask: t.replace(/〔(.*?)〕/g, "＿＿"),
    masked: /〔.*?〕/.test(t)
  };
}

function makeQuestion(card) {
  if (card.kind === "pat") {
    const pool = TYPES.filter(t => t !== card.t);
    const opts = shuffle(pool).slice(0, 3).map(t => ({ label: t, correct: false }));
    opts.push({ label: card.t, correct: true });
    return { card, type: "pat", opts: shuffle(opts) };
  }

  // 22% 填空，剩下的按 35% 反向
  const r = Math.random();
  if (r < 0.22) return { card, type: "fill", opts: [] };

  const others = DATA[card.ch].map((x, i) => Object.assign({ i }, x)).filter(x => x.i !== card.idx);
  if (r < 0.22 + 0.35 * 0.85 && others.length >= 2) {
    const ex = pickExample(card);
    const opts = shuffle(others).slice(0, 3).map(o => {
      const e = pickExample(o);
      return { label: e.e + "（" + e.src + "）", correct: false };
    });
    opts.push({ label: ex.e + "（" + ex.src + "）", correct: true });
    return { card, type: "rev", opts: shuffle(opts) };
  }
  const opts = shuffle(others).slice(0, 3).map(o => ({ label: o.g, correct: false }));
  opts.push({ label: card.g, correct: true });
  return { card, type: "fwd", opts: shuffle(opts) };
}

/* ============================================================
   界面
   ============================================================ */
const $ = id => document.getElementById(id);
const show = id => ["home", "quiz", "done"].forEach(x => $(x).classList.toggle("hide", x !== id));

function refreshHome() {
  const d = new Date();
  const pat = state.mode === "pattern";
  $("todayLabel").textContent = d.getMonth() + 1 + " 月 " + d.getDate() + " 日 · " +
    (pat ? "句式 " + DATA2.length + " 句" : Object.keys(DATA).length + " 字 " + allCards().length + " 义");
  $("sNewLabel").textContent = pat ? "新句式" : "新义项";

  $("introList").innerHTML = pat
    ? "<li>每道题给一句古文，判断它属于<b>哪种句式</b>。</li>" +
      "<li>七类：判断 / 被动 / 宾语前置 / 定语后置 / 状语后置 / 省略 / 固定句式。</li>" +
      "<li>答完给<b>标志词、还原、译文、以及判断出来之后要做什么</b>。</li>"
    : "<li>每张卡考一个<b>义项</b>，不是考一个字。同一个「之」，五个义项是五张卡。</li>" +
      "<li>选项全部来自同一个字，模拟真实混淆。</li>" +
      "<li>答错会把两张卡重新排进队列，明天先考。</li>";

  const due = dueCards().length, nw = newCards().length;
  $("sDue").textContent = due;
  $("sNew").textContent = nw;
  const b = statBucket();
  $("sTotal").textContent = b.a;
  $("sAcc").textContent = b.a ? Math.round(b.r / b.a * 100) + "%" : "–";

  const pairs = Object.values(state.confusions || {}).sort((x, y) => y.n - x.n).slice(0, 3);
  $("confList").innerHTML = pairs.length
    ? pairs.map(p => '<li>「' + p.ch + "」的 <b>" + p.correct + "</b> 被你选成 <i>" + p.chosen + "</i> · " + p.n + " 次</li>").join("")
    : '<li style="color:var(--dim)">还没有数据，先做一组</li>';
}

function syncFilter() {
  const pat = state.mode === "pattern";
  $("mSense").classList.toggle("on", !pat);
  $("mPat").classList.toggle("on", pat);
  $("fAll").classList.toggle("on", !pat && state.filter !== "高中");
  $("fHs").classList.toggle("on", !pat && state.filter === "高中");
  $("fAll").style.opacity = pat ? ".35" : "1";
  $("fHs").style.opacity = pat ? ".35" : "1";
  refreshHome();
}

/* ---------- 出题卡渲染 ---------- */
function renderQuestion() {
  const q = session.queue[session.i];
  if (!q) return finish();
  const c = q.card;

  $("qProgress").textContent = (session.i + 1) + " / " + session.queue.length;
  $("qFb").classList.add("hide");
  $("nextBtn").classList.add("hide");
  const box = $("qOpts");
  box.innerHTML = "";

  if (q.type === "pat") {
    $("qChar").innerHTML = "句式 · 第 " + (c.idx + 1) + " 句";
    $("qCharBig").innerHTML = "";
    $("qEx").innerHTML = c.s;
    $("qSrc").innerHTML = c.src + '<div class="tr">这句属于哪种句式？（答完给你「还原」和「有什么用」）</div>';
    q.opts.forEach((o, k) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = '<span class="k">' + "ABCD"[k] + '</span><span>' + o.label + "</span>";
      b.onclick = () => answer(o, b);
      box.appendChild(b);
    });
    return;
  }

  $("qChar").innerHTML = c.ch + " · 第 " + (c.idx + 1) + " 义" +
    '<span class="tag ' + (c.st === "高中" ? "hs" : "") + '">' + c.st + "</span>" +
    (c.v === false ? '<span class="tag warn">待核</span>' : "");
  $("qCharBig").innerHTML = c.ch + '<small>' + c.f + '</small>';

  if (q.type === "rev") {
    $("qEx").innerHTML = "「" + c.g + "」";
    $("qSrc").innerHTML = "下面哪一句用了这个义项？（答完给译文）";
  } else {
    const ex = q.shown || (q.shown = pickExample(c));
    const T = splitT(ex.tt);
    $("qEx").innerHTML = q.type === "fill"
      ? ex.e.split(c.ch).join("<em>＿＿</em>")
      : ex.e.split(c.ch).join("<em>" + c.ch + "</em>");
    $("qSrc").innerHTML = ex.src +
      (T.full ? '<div class="tr">大意：' + (T.masked ? T.mask : T.full) + "</div>" : "") +
      (q.type === "fill" ? '<div class="tr">——这个字在这里是什么意思？</div>' : "");
  }

  if (q.type === "fill") {
    box.innerHTML =
      '<div style="display:flex;gap:8px">' +
        '<input id="fillInput" placeholder="写义项，如：到、往" autocomplete="off" ' +
        'style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;' +
        'padding:12px 14px;font:inherit;font-size:15px;color:var(--ink)" />' +
        '<button class="btn" id="fillOk" style="padding:12px 18px">提交</button>' +
      "</div>";
    const input = $("fillInput");
    if (input) {
      input.focus();
      input.addEventListener("keydown", e => { if (e.key === "Enter") checkFill(q, input.value); });
    }
    $("fillOk").onclick = () => checkFill(q, $("fillInput").value);
    return;
  }

  q.opts.forEach((o, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="k">' + "ABCD"[k] + '</span><span>' + o.label + "</span>";
    b.onclick = () => answer(o, b);
    box.appendChild(b);
  });
}

/* ---------- 评分后的公共收尾 ---------- */
function settle(card, ok) {
  const st = cardState(card.id);
  st.seen++;
  if (ok) {
    st.lv = Math.min(st.lv + 1, INTERVALS.length - 1);
    st.due = Date.now() + INTERVALS[st.lv] * DAY;
  } else {
    st.lv = 0; st.wrong++;
    st.due = Date.now() + 10 * 60000;
  }
  state.cards[card.id] = st;
  bump(ok);
  session[ok ? "right" : "wrong"]++;
  save();
  $("nextBtn").classList.remove("hide");
  $("nextBtn").onclick = () => { session.i++; renderQuestion(); };
}

function exampleLines(card, exclude) {
  const list = examplesOf(card).filter(x => x.e !== exclude);
  if (!list.length) return "";
  return list.slice(0, 2).map(function (x, i) {
    const T = splitT(x.tt);
    return '<div class="sig">' + (i === 0 ? "例句：" : "另一个例子：") + x.e + "（" + x.src + "）" +
      (T.full ? "　<b>译文：</b>" + T.full : "") + "</div>";
  }).join("");
}

/* ---------- 选择题作答 ---------- */
function answer(opt, btn) {
  const q = session.queue[session.i];
  const card = q.card;
  const ok = !!opt.correct;
  [...$("qOpts").children].forEach((el, k) => {
    el.disabled = true;
    if (q.opts[k] && q.opts[k].correct) el.classList.add("right");
  });
  if (!ok) btn.classList.add("wrong");

  const fb = $("qFb");

  if (q.type === "pat") {
    session.records.push({ type: "pat", ok: ok, t: card.t, s: card.s, chosen: opt.label });
    fb.classList.remove("hide");
    fb.innerHTML = (ok ? "<b>对了。</b>" : "<b>不对。</b>") + "这句是「" + card.t + "」" +
      '<div class="sig">标志：' + card.mark + "</div>" +
      (card.fix ? '<div class="sig">还原：' + card.fix + "</div>" : "") +
      '<div class="sig"><b>译文：</b>' + card.tr + "（" + card.src + "）</div>" +
      (TYPE_USE[card.t] ? '<div class="sig" style="margin-top:6px;color:var(--warm)"><b>判断它有什么用：</b>' + TYPE_USE[card.t] + "</div>" : "");
    settle(card, ok);
    return;
  }

  let chosenG = opt.label;
  if (q.type === "rev") {
    const senses = DATA[card.ch];
    const idx = senses.findIndex(x => (x.e && opt.label.indexOf(x.e) === 0) || (x.e2 && opt.label.indexOf(x.e2) === 0));
    if (idx >= 0) chosenG = senses[idx].g;
  }
  if (!ok) {
    const key = card.ch + "|" + card.idx + "|" + chosenG;
    const rec = state.confusions[key] || { ch: card.ch, correct: card.g, chosen: chosenG, n: 0 };
    rec.n++; state.confusions[key] = rec;
  }
  session.records.push({ type: q.type, ok: ok, ch: card.ch, g: card.g, chosen: chosenG });

  const shownEx = q.shown ? q.shown.e : null;
  const shownT = q.shown ? splitT(q.shown.tt).full : "";
  fb.classList.remove("hide");
  fb.innerHTML = (ok ? "<b>对了。</b>" : "<b>不对。</b>") + "这个义项是「" + card.g + "」" +
    (ok ? "" : '<div class="sig">你选的是「' + chosenG + "」</div>") +
    '<div class="sig">判断信号：' + card.s + "</div>" +
    (q.type === "rev" ? exampleLines(card, null)
                      : (shownT ? '<div class="sig"><b>译文：</b>' + shownT + "</div>" : "") + exampleLines(card, shownEx));
  settle(card, ok);
}

/* ---------- 填空判分 ---------- */
const SYN = { "去": ["往", "到"], "由于": ["因为"], "拿": ["用"], "被": ["为"], "给": ["为", "与"] };
function gradeFill(card, input) {
  const ans = String(input || "").trim();
  if (!ans) return false;
  const keys = (card.g || "").split(/[，、,／/（）()\s]+/).filter(t => t.length >= 1);
  for (const k of keys) {
    if (ans.indexOf(k) >= 0) return true;
    if (k.indexOf(ans) >= 0) return true;
    for (const t of (SYN[k] || [])) if (ans.indexOf(t) >= 0) return true;
  }
  return false;
}

function checkFill(q, value) {
  const card = q.card;
  const ok = gradeFill(card, value);
  const input = $("fillInput");
  if (input) { input.disabled = true; input.style.borderColor = ok ? "var(--ok)" : "var(--bad)"; }
  const btn = $("fillOk");
  if (btn) { btn.disabled = true; btn.textContent = ok ? "✓" : "✗"; }

  session.records.push({ type: "fill", ok: ok, ch: card.ch, g: card.g, chosen: value || "（空）" });
  if (!ok) {
    const key = card.ch + "|" + card.idx + "|fill";
    const rec = state.confusions[key] || { ch: card.ch, correct: card.g, chosen: "填空：" + (value || "（空）"), n: 0 };
    rec.n++; state.confusions[key] = rec;
  }

  const fb = $("qFb");
  fb.classList.remove("hide");
  fb.innerHTML = (ok ? "<b>对了。</b>" : "<b>不对。</b>") + "这个义项是「" + card.g + "」" +
    '<div class="sig">判断信号：' + card.s + (value ? "　你写的是：「" + value + "」" : "") + "</div>" +
    (q.shown ? '<div class="sig"><b>译文：</b>' + splitT(q.shown.tt).full + "</div>" : "") +
    exampleLines(card, q.shown ? q.shown.e : null);
  settle(card, ok);
}

/* ---------- 组末报告 ---------- */
function finish() {
  show("done");
  const r = session.records;
  const total = r.length;
  const right = r.filter(x => x.ok).length;
  const secs = Math.max(1, Math.round((Date.now() - session.startAt) / 1000));
  const mm = Math.floor(secs / 60), ss = secs % 60;
  const pct = v => Math.round(v * 100) + "%";
  const label = { fwd: "正向（句→义）", rev: "反向（义→句）", fill: "填空（自己写）", pat: "句式判断" };

  const byType = {};
  r.forEach(x => { const t = byType[x.type] || (byType[x.type] = { n: 0, ok: 0 }); t.n++; if (x.ok) t.ok++; });

  const byChar = {};
  r.filter(x => !x.ok).forEach(x => {
    const key = x.type === "pat" ? x.t : x.ch;
    if (key) byChar[key] = (byChar[key] || 0) + 1;
  });
  const worst = Object.entries(byChar).sort((a, b) => b[1] - a[1]).slice(0, 3);
  const errs = r.filter(x => !x.ok);

  let html = '<li style="font-size:15px;color:#f0e6d8">本组 ' + total + " 题 · 答对 " + right +
    "（" + pct(total ? right / total : 0) + "）· 用时 " + (mm ? mm + " 分 " : "") + ss + " 秒</li>";

  html += '<li style="margin-top:10px;color:var(--dim);font-size:12px">按题型</li>';
  Object.keys(byType).forEach(k => {
    const t = byType[k];
    html += "<li>" + (label[k] || k) + "　" + t.n + " 题，对 " + t.ok + "（" + pct(t.ok / t.n) + "）</li>";
  });

  if (worst.length) {
    html += '<li style="margin-top:10px;color:var(--dim);font-size:12px">' +
      (state.mode === "pattern" ? "错得最多的类型" : "错得最多的字") + "</li>";
    worst.forEach(([k, n]) => { html += "<li>「" + k + "」错 " + n + " 次</li>"; });
  }

  if (errs.length) {
    html += '<li style="margin-top:10px;color:var(--dim);font-size:12px">本组错题（' + errs.length + "）</li>";
    errs.slice(0, 12).forEach(x => {
      html += x.type === "pat"
        ? '<li>「' + x.t + "」" + x.s + "　你答：" + String(x.chosen).slice(0, 12) + "</li>"
        : '<li>「' + x.ch + "」<b>" + x.g + "</b>　你答：" + String(x.chosen).slice(0, 18) + "</li>";
    });
    html += '<li style="margin-top:10px;color:var(--dim);font-size:12px">说明</li>' +
      "<li>错题 10 分钟后到期，下一组会先出现——这是间隔重复的安排，不是重来。</li>";
  } else {
    html += '<li style="margin-top:10px;color:var(--ok)">全对，这一组没有错题。</li>';
  }

  const advice = [];
  const keys = Object.keys(byType);
  if (keys.length >= 2) {
    const w = keys.map(k => [k, byType[k].ok / byType[k].n]).sort((a, b) => a[1] - b[1])[0];
    if (w[1] < 0.8) advice.push("「" + (label[w[0]] || w[0]) + "」正确率 " + pct(w[1]) + "，是这组最弱的一环");
  }
  if (worst.length && worst[0][1] >= 2) {
    advice.push("「" + worst[0][0] + "」错了 " + worst[0][1] + " 次，建议单独梳一遍");
  }
  if (right === total && total >= 10) advice.push("这组全对——可以加题量或换「只考高中」");
  if (!advice.length) advice.push("这组看不出明显短板，保持节奏");

  html += '<li style="margin-top:10px;color:var(--dim);font-size:12px">建议</li>';
  advice.forEach(a => { html += "<li>· " + a + "</li>"; });

  $("doneList").innerHTML = html;
  refreshHome();
}

/* ---------- 开一组 ---------- */
let session = null;
function startSession(size) {
  const due = shuffle(dueCards());
  const nw = shuffle(newCards());
  const picked = [], perChar = {};
  for (const c of [...due, ...nw]) {
    if (picked.length >= size) break;
    if (c.ch) {
      if ((perChar[c.ch] || 0) >= 2) continue;
      perChar[c.ch] = (perChar[c.ch] || 0) + 1;
    }
    picked.push(c);
  }
  if (!picked.length) {
    alert("全部卡片都在等待复习时间。想加练，点「清空」会重新开始。");
    return;
  }
  session = { queue: picked.map(makeQuestion), i: 0, right: 0, wrong: 0, wrongList: [], startAt: Date.now(), records: [] };
  show("quiz");
  renderQuestion();
}

/* ---------- 事件 ---------- */
$("mSense").onclick = () => { state.mode = "sense"; save(); syncFilter(); };
$("mPat").onclick = () => { state.mode = "pattern"; save(); syncFilter(); };
$("fAll").onclick = () => { state.filter = "all"; save(); syncFilter(); };
$("fHs").onclick = () => { state.filter = "高中"; save(); syncFilter(); };
$("startBtn").onclick = () => startSession(20);
$("againBtn").onclick = () => startSession(20);
$("backBtn").onclick = () => { refreshHome(); show("home"); };
$("quitBtn").onclick = () => { if (session) finish(); };

$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "文言进度-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
};
$("importBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.cards) throw new Error("格式不对");
      state = d; save(); syncFilter();
      alert("已导入");
    } catch (err) { alert("导入失败：" + err.message); }
  };
  r.readAsText(f);
};
$("resetBtn").onclick = () => {
  if (!confirm("清空所有进度？导出过备份再清。")) return;
  state = { cards: {}, confusions: {}, filter: "all", mode: state.mode || "sense" };
  save(); syncFilter();
};

syncFilter();
